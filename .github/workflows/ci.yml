name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build-check en tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pin de Xcode-versie: de runner-standaard verschuift, en dan wisselt de
      # SDK waartegen gebouwd wordt stilzwijgend mee.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode-versie
        run: xcodebuild -version

      # Opmaakcontrole, geen lint-run: `swift format lint` zou permanent rood staan
      # op regels die de formatter niet kán afbreken — de CSS-blokken in
      # ItemDetailView en de promptteksten in AppConfiguration zijn string-literals
      # boven de 120 tekens. Dit toetst wat wél te halen is: is de broncode door de
      # formatter gehaald? De formatter komt uit dezelfde Xcode als hierboven, zodat
      # CI en een Mac dezelfde versie gebruiken.
      - name: Opmaak
        run: |
          swift format --version
          swift format -i -r RSSReader RSSReaderTests
          if ! git diff --exit-code -- '*.swift'; then
            echo "::error::De broncode is niet opgemaakt met swift-format."
            echo "Draai lokaal 'swift format -i -r RSSReader RSSReaderTests' en commit het resultaat."
            exit 1
          fi

      # Het .xcodeproj wordt gegenereerd uit project.yml (XcodeGen); zie CLAUDE.md.
      - name: Project genereren
        run: |
          brew install xcodegen
          xcodegen generate

      # Het getrackte .xcodeproj is gegenereerde uitvoer. Wijkt het af van wat
      # project.yml oplevert, dan mist Xcode lokaal bestanden die CI wél bouwt —
      # een test kan dan in Xcode onzichtbaar zijn terwijl CI hem draait (#92).
      - name: Gegenereerd project is actueel
        run: |
          if ! git diff --exit-code --stat RSSReader.xcodeproj/; then
            echo "::error::Het getrackte .xcodeproj loopt achter op project.yml."
            echo "Draai lokaal 'xcodegen generate' en commit het resultaat."
            exit 1
          fi

      # Zonder toestelnaam, conform stap 2 van Workflow-feature.md.
      - name: Build-check
        run: |
          xcodebuild -project RSSReader.xcodeproj -scheme RSSReader \
            -destination 'generic/platform=iOS Simulator' build

      # Tests hebben wel een echt toestel nodig. Zoek er een op in plaats van een
      # naam/OS-combinatie vast te leggen: die verschilt per Xcode-installatie.
      - name: Simulator kiezen
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in sorted(devices.items()):
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if "iPhone" in device["name"]:
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("Geen iPhone-simulator beschikbaar")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Tests
        run: |
          xcodebuild -project RSSReader.xcodeproj -scheme RSSReader \
            -destination "id=${{ steps.sim.outputs.udid }}" test
