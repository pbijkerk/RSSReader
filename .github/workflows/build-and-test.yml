name: Build and Test RSSReader

# Trigger op push naar main of PRs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build RSSReader (Debug)
        run: |
          xcodebuild \
            -project RSSReader.xcodeproj \
            -scheme RSSReader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            clean build

      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project RSSReader.xcodeproj \
            -scheme RSSReader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage YES \
            test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: Test-Results
          path: build/Logs/Test/
          retention-days: 7
